title: The History of the Decline and Fall of the Roman Empire
author: Edward Gibbon
year: "1776"
mood: history

entries:
  - quote: |
      History is indeed little more than the register of the crimes, follies, and
      misfortunes of mankind.
    where: "vol. I, ch. 3"
    date: 2026-07-30
    commentary: |
      He says this and then writes six volumes of it anyway, which tells you what
      he actually thought the register was for.

# ─────────────────────────────────────────────────────────────────────────────
#  One file per book, in books/. The filename becomes the URL slug and the
#  PDF name (books/meditations.yaml → docs/books/meditations.html,
#  build/meditations.pdf). Copy this file to start a new one, or run
#  `python3 build.py --new`.
#
#  Book fields:
#    title, author (required)
#    mood        (required)  default typography for every entry in this book:
#                            philosophy, poetry, fiction, science, memoir,
#                            humour, history, reflection  (see moods.yaml)
#    translator, year, read  (optional)  `read` = when you read it, e.g. 2026-08
#    notes       (optional)  a paragraph or two about the book as a whole,
#                            printed before the entries
#
#  Entry fields (under `entries:`):
#    quote       (required)  Lines are reflowed; a blank line = new paragraph.
#                            Set `verse: true` to keep line breaks (automatic
#                            for poetry).
#    where       (optional)  "p. 42", "Book IV, 3", "ch. 7"
#    date        (optional)  YYYY-MM-DD when you recorded it
#    mood        (optional)  override the book's mood for this entry only
#    tags        (optional)  free-form list
#    commentary  (optional)  your notes; *italic*, **bold**, `code`, [link](url)
#
#  Use real “ ” ‘ ’ quotation marks; --- and -- become — and –.
# ─────────────────────────────────────────────────────────────────────────────
title: Meditations
author: Marcus Aurelius
translator: George Long
year: "c. 180"
mood: philosophy
read: 2026-08
notes: |
  Read in the Long translation, which is stiffer than Hays but keeps the
  sentence rhythm of a man writing notes to himself rather than for a reader.

entries:
  - quote: |
      The universe is change; our life is what our thoughts make it.
    where: "Book IV, 3"
    date: 2026-09-01
    tags: [stoicism]
    commentary: |
      The second clause is the one that survives contact with a bad week. The
      first is the premise it rests on — if nothing holds still, then the only
      fixed point available is the *stance* you take, not the thing you take it
      towards.

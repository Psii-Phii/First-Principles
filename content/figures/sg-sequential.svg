<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" role="img" aria-label="Sequential polarizers: x then y passes nothing; x then 45 degrees then y passes something" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="sgs-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="sgs-ox" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#732b2b"/>
    </marker>
  </defs>
  <!-- row 1: x -> y : nothing -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="30" y1="50" x2="120" y2="50" marker-end="url(#sgs-ink)"/>
    <rect x="126" y="28" width="44" height="44"/>
    <line x1="170" y1="50" x2="248" y2="50" marker-end="url(#sgs-ink)"/>
    <rect x="254" y="28" width="44" height="44"/>
    <line x1="298" y1="50" x2="376" y2="50" stroke-dasharray="5 5"/>
  </g>
  <g fill="currentColor" font-size="18" font-style="italic" text-anchor="middle">
    <text x="148" y="56">x</text>
    <text x="276" y="56">y</text>
  </g>
  <text x="388" y="55" fill="currentColor" font-size="14" opacity="0.75">nothing</text>

  <!-- row 2: x -> 45 -> y : something -->
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <line x1="30" y1="140" x2="120" y2="140" marker-end="url(#sgs-ink)"/>
    <rect x="126" y="118" width="44" height="44"/>
    <line x1="170" y1="140" x2="216" y2="140" marker-end="url(#sgs-ink)"/>
    <rect x="222" y="118" width="44" height="44"/>
    <line x1="266" y1="140" x2="312" y2="140" marker-end="url(#sgs-ink)"/>
    <rect x="318" y="118" width="44" height="44"/>
  </g>
  <line x1="362" y1="140" x2="446" y2="140" stroke="#732b2b" stroke-width="1.6" marker-end="url(#sgs-ox)"/>
  <g fill="currentColor" font-size="18" font-style="italic" text-anchor="middle">
    <text x="148" y="146">x</text>
    <text x="340" y="146">y</text>
  </g>
  <text x="244" y="146" fill="currentColor" font-size="15" text-anchor="middle">45&#176;</text>
  <text x="454" y="137" fill="#732b2b" font-size="14">something</text>
  <text x="454" y="153" fill="#732b2b" font-size="14">comes out</text>
</svg>

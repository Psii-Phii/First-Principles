<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" role="img" aria-label="Stern-Gerlach apparatus: furnace, collimator, magnet, and screen with two spots" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="sga-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#732b2b"/>
    </marker>
    <marker id="sga-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.4" fill="none">
    <!-- furnace -->
    <rect x="14" y="100" width="46" height="30"/>
    <!-- beam from furnace to collimator -->
    <line x1="60" y1="115" x2="104" y2="115" marker-end="url(#sga-arrow-ink)"/>
    <!-- collimator slits -->
    <line x1="112" y1="72" x2="112" y2="105"/>
    <line x1="112" y1="125" x2="112" y2="158"/>
    <!-- magnet pole pieces -->
    <path d="M158 64 h96 v14 h-96 z"/>
    <path d="M158 152 h96 v14 h-96 z"/>
    <!-- beam through magnet -->
    <line x1="112" y1="115" x2="160" y2="115"/>
    <!-- split beams -->
    <path d="M160 115 C 250 113, 330 85, 432 48" stroke="#732b2b"/>
    <path d="M160 115 C 250 117, 330 145, 432 182" stroke="#732b2b"/>
    <!-- screen -->
    <line x1="440" y1="30" x2="440" y2="205"/>
  </g>
  <!-- z-hat arrow beside the magnet -->
  <line x1="206" y1="147" x2="206" y2="90" stroke="#732b2b" stroke-width="1.6" marker-end="url(#sga-arrow)"/>
  <!-- spots -->
  <circle cx="437" cy="48" r="3.2" fill="currentColor"/>
  <circle cx="437" cy="182" r="3.2" fill="currentColor"/>
  <g fill="currentColor" font-size="17" font-style="italic">
    <text x="214" y="99">z&#770;</text>
    <text x="452" y="53">N</text>
    <text x="452" y="187">N</text>
    <text x="447" y="222">P</text>
  </g>
  <g fill="currentColor" font-size="12" font-style="italic">
    <text x="466" y="58">1</text>
    <text x="466" y="192">2</text>
  </g>
  <g fill="currentColor" font-size="13" opacity="0.75">
    <text x="10" y="150">furnace</text>
    <text x="88" y="180">collimator</text>
    <text x="172" y="188">magnet</text>
  </g>
</svg>

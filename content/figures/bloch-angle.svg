<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" width="240" role="img" aria-label="Unit circle in the r0-r1 plane with radius at angle theta over two" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ba-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <!-- axes -->
    <line x1="20" y1="120" x2="220" y2="120" marker-end="url(#ba-ink)"/>
    <line x1="110" y1="200" x2="110" y2="20" marker-end="url(#ba-ink)"/>
    <!-- unit circle -->
    <circle cx="110" cy="120" r="62" opacity="0.55"/>
  </g>
  <!-- radius at angle theta/2 (about 35 degrees) -->
  <line x1="110" y1="120" x2="160.8" y2="84.4" stroke="#732b2b" stroke-width="1.6"/>
  <circle cx="160.8" cy="84.4" r="2.8" fill="#732b2b"/>
  <!-- angle arc -->
  <path d="M 136 120 A 26 26 0 0 0 131.3 105.1" stroke="#732b2b" stroke-width="1.1" fill="none"/>
  <g fill="currentColor" font-size="16" font-style="italic">
    <text x="206" y="141">r</text>
    <text x="94" y="34">r</text>
    <text x="143" y="116" fill="#732b2b">&#952;/2</text>
  </g>
  <g fill="currentColor" font-size="11" font-style="italic">
    <text x="215" y="146">0</text>
    <text x="103" y="39">1</text>
  </g>
</svg>

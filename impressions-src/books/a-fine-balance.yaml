title: "A Fine Balance"
author: "Rohinton Mistry"
mood: reflection
read: 2026-09

entries:

  - quote: |
      Why, he wondered he kept working now… Why did he not jump off the top of one of them? Why did he not make a bonfire of the receipts and the cash, and throw himself onto it drenched in kerosene? How was it his heart kept beating instead of bursting, his sanity intact instead of shattering like a dropped mirror? Was it all made of tough synthetic material, like the indestructible plastic folder?  And was time, the great vandal being neglectful ?
    date: 2026-09-06

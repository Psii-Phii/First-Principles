  - quote: |
      “said, “Why are my sons followed thus by darkness?” His kemmering said, “Because they were born in the house of flesh, therefore death follows at their heels. They are in the middle of time. In the beginning there was the sun and the ice, and there was no shadow. In the end when we are done, the sun will devour itself and shadow will eat light, and there will be nothing left but the ice and the darkness.”

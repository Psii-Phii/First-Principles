  - quote: |
      “ Any need to explain the sources of that fear vanished with the fear;  what I was left with was, at last, acceptance of him as he was.  Until then I had rejected him, refused him his own reality.  He had been quite right to say that he, the only person on Gethen who trusted me, was the only Gethenian I distrusted. For he was the only one who had entirely accepted me as a human being: who had liked me personally and given me entire personal loyalty:  and who therefore had demanded of me an equal degree of recognition,  of acceptance.  I had not been willing to give it.  I had been afraid to give it.  I had not wanted to give my trust,  my friendship to a man who was a woman,  a woman who was a man.”
    where: "Genly Ai"
    date: 2026-09-06

  - quote: |
      “A profound love between two people involves, after all, the power and chance of doing profound hurt”
    where: "Genly Ai"
    date: 2026-09-06

  - quote: |
      “A friendship so much needed by us both in our exile, and already so well proved in the days and nights of our bitter journey, that it might as well be called, now as later, love. But it was from the difference between us, not from the affinities and likenesses, but from the difference, that that love came: and it was itself the bridge, the only bridge, across what divided us. ”
    where: "Genly Ai"
    date: 2026-09-06

  - quote: |
      “Alone, I cannot change your world. But I can be changed by it.  Alone, I must listen, as well as speak. Alone, the relationship I finally make, if I make one, is not impersonal and not only political: it is individual, it is personal, it is both more and less than political.  Not We and They;  not I and It;  but I and Thou. Not political, not pragmatic, but mystical. In a certain sense the Ekumen is not a body politic, but a body mystic.  It considers beginnings to be extremely important.   Beginnings, and means.  Its doctrine is just the reverse of the doctrine that the end justifies the means. It proceeds, therefore,  by subtle ways,  and slow ones,  and queer,  risky ones;  rather as evolution does,  which is in certain senses its model. ... So I was sent alone,  for your sake?  Or for my own?  I  don’t know. ”
    where: "Genly Ai"
    date: 2026-09-06

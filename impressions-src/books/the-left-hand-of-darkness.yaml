  - quote: |
      Truth is a matter of the imagination. The soundest fact may fail or prevail in the style of its telling: like that singular organic jewel of our seas, which grows brighter as one woman wears it and, worn by another, dulls and goes to dust. Facts are no more solid, coherent, round and real than pearls are. But both are sensitive.
    where: "Gently Ai"
    date: 2026-09-06
    commentary: |
      On the fickle nature of  "Truth".  

  - quote: |
      King in his own eyes is Kharide
    where: "Prime Minister Estraven"
    date: 2026-09-06
    commentary: |
      To a king, or rather a madman, his country is not its people, its culture, or its struggles. It is nothing but himself: his pride and his power. The nation is the king's ego: every wound to it is a wound to him, every praise of it is praise of him. Every judgment of the nation is a judgment of the king.

  - quote: |
      When I say patriotism. I mean fear. The fear of the other. And its expressions are political, not poetical: hate, rivalry, aggression. It grows in us that fear. It grows in us year by year.
    where: "Prime minister Estraven"
    date: 2026-09-06

  - quote: |

  - quote: |
      King in his own eyes is Kharide
    where: "Prime Minister Estraven"
    date: 2026-09-06
    commentary: |
      To a king, or rather a madman, his country is not its people, its culture, or its struggles. It is nothing but himself: his pride and his power. He is not the representative of the people,  he is the people; the nation is because he is. The nation is the king's ego: every wound to him is a wound to the nation, every praise of him is the praise of the nation, every judgment of him a judgment of the nation itself. Love of the king is the love of the nation.

  - quote: |
      When I say patriotism. I mean fear. The fear of the other. And its expressions are political, not poetical: hate, rivalry, aggression. It grows in us that fear. It grows in us year by year.
    where: "Prime minister Estraven"
    date: 2026-09-06


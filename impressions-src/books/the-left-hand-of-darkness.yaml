  - quote: |
      He wanted his hearers to be frightened and angry. His themes were not pride and love at all, though he used the words perpetually; as he used them they meant self-praise and hate. He talked a great deal about Truth also, for he was, he said, “cutting down beneath the veneer of civilization.”
    date: 2026-09-06
    commentary: |
      Thoughts of Estraven on a speech given by the new prime minister who was responsible for his exile. 


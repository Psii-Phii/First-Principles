entries:

  - quote: |
      Truth is a matter of the imagination. The soundest fact may fail or prevail in the style of its telling: like that singular organic jewel of our seas, which grows brighter as one woman wears it and, worn by another, dulls and goes to dust. Facts are no more solid, coherent, round and real than pearls are. But both are sensitive.
    where: "Gently Ai"
    date: 2026-09-06
    commentary: |
      On the fickle nature of  "Truth".  

  - quote: |
      King in his own eyes is Kharide
    where: "Prime Minister Estraven"
    date: 2026-09-06
    commentary: |
      To a king, or rather a madman, his country is not its people, its culture, or its struggles. It is nothing but himself: his pride and his power. The nation is the king's ego: every wound to it is a wound to him, every praise of it is praise of him. Every judgment of the nation is a judgment of the king.

  - quote: |
      When I say patriotism. I mean fear. The fear of the other. And its expressions are political, not poetical: hate, rivalry, aggression. It grows in us that fear. It grows in us year by year.
    where: "Prime minister Estraven"
    date: 2026-09-06

  - quote: |
      progress is less important than presence.
    date: 2026-09-06

  - quote: |
      To exhibit the perfect uselessness of the knowing the answer to the wrong question
    where: "Faxe"
    date: 2026-09-06
    commentary: |
      On the planet Winter, the Handdarata is one of the two major religions, the other one being the Yomeshta. The cornerstone belief of the Handdarata is that one should strive towards ignorance, while the Yomeshta hold that all of time was seen at once by Meshe, and so all is already known, all is light. Despite the pursuit of ignorance, the Handdarata follow the mystical ritual of foretelling. The ritual has primarily the asker and the foretellers: the asker gets to ask one question, usually at a high material cost and often an even higher personal cost. It seems funny that the religion of ignorance has the ability to foretell the future so exactly.  The foretellings seldom bring the solace the asker sought; rather, their lives are further worsened by knowing than by unknowing. It goes to show the value of ignorance to human existence, and the futility of chasing certainty, for a life fully known is death.

  - quote: |
      Ignorance is a ground of thought. Unproof is the ground of action.
    where: "Faxe"
    date: 2026-09-06

  - quote: |
      Faxe: What is known? What is sure. predictable, inevitable-the one certain thing you know concerning your future and mine ? 
      
      Genly Ai:  That we shall die. 
      
      Faxe: ... The only thing that makes life possible is permanent, intolerable uncertainty: not knowing what comes next.
    date: 2026-09-06

  - quote: |
      Burden and privilege are shared out equally; everybody has the same risk to run choice to make. Therefore nobody here is quite as free as a free male anywhere else.
    date: 2026-09-06
    commentary: |
      -A comment made on the androgynous society of Winter. 

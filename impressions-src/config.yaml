# Project-wide settings shared by the PDF and the website.
title: Impressions
subtitle: What the books left behind
owner: RK
# Shown in the site footer and on the PDF title page. Leave blank to hide.
tagline: "Kept since 2026."
# Where the generated pages go, relative to this folder. ../impressions is the
# /impressions/ section of the First Principles site (the repo root is served).
site_dir: ../impressions
# LaTeX output directory (git-ignored).
build_dir: build
# TeX engine for `build.py --pdf`: auto (LuaLaTeX if its font loader is installed,
# otherwise XeLaTeX), or force lualatex / xelatex. Both work with fontspec.
engine: auto

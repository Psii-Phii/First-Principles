<script>
(function () {
  var chips = document.querySelectorAll('.topics button[data-filter]');
  if (!chips.length) return;
  var entries = document.querySelectorAll('.entry');
  var empty = document.querySelector('.empty');
  function apply(mood, push) {
    var shown = 0;
    entries.forEach(function (el) {
      var on = mood === 'all' || el.dataset.mood === mood;
      el.hidden = !on; if (on) shown++;
    });
    chips.forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.filter === mood ? 'true' : 'false'); });
    if (empty) empty.hidden = shown > 0;
    if (push) history.replaceState(null, '', mood === 'all' ? location.pathname : '?mood=' + mood);
  }
  chips.forEach(function (c) { c.addEventListener('click', function () { apply(c.dataset.filter, true); }); });
  var m = new URLSearchParams(location.search).get('mood');
  if (m) apply(m, false);
})();
</script>
